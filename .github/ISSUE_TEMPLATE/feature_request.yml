name: Feature request
description: Suggest an idea, effect or hand sign
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: The problem it solves or the moment it would make better.
